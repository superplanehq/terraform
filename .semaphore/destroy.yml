version: v1.0
name: Ephemeral Environments - Destroy
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
queue:
  name: terraform-install-tests
  scope: project
  processing: serialized
blocks:
  - name: AWS
    dependencies: []
    task:
      prologue:
        commands:
          - checkout
          - curl -fsSLo /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_linux_amd64.zip
          - "printf '%s  /tmp/terraform.zip\\n' 'dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df' | sha256sum -c -"
          - unzip -q /tmp/terraform.zip terraform -d /tmp
      jobs:
        - name: Destroy AWS
          commands:
            - bash scripts/destroy-terraform.sh aws
  - name: GCP
    dependencies: []
    task:
      prologue:
        commands:
          - checkout
          - curl -fsSLo /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_linux_amd64.zip
          - "printf '%s  /tmp/terraform.zip\\n' 'dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df' | sha256sum -c -"
          - unzip -q /tmp/terraform.zip terraform -d /tmp
      jobs:
        - name: Destroy GCP
          commands:
            - bash scripts/destroy-terraform.sh gcp
